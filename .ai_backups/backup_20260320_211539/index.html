<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="appName">Хроники Метерии: AI Приключение</title>
    
    <!-- Шрифты для атмосферы -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=MedievalSharp&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    
</head>
<body>
    <!-- ГРАФИЧЕСКИЕ ЭФФЕКТЫ -->
    <div class="vignette"></div>
    <div class="film-grain"></div>
    <div class="universal-particles"></div>
        <!-- Генератор динамического фрактального тумана -->
    <div class="fog-wrapper">
        <div class="fog-base"></div>
        <div class="fog-extra"></div>
    </div>
    <svg style="display:none">
        <filter id="fog-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="1">
                <animate attributeName="seed" from="1" to="100" dur="60s" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" scale="250" />
        </filter>
    </svg>

    <!-- Контейнер для динамического фона -->
    <div id="background-container">
        <!-- Сюда JS будет добавлять img или video -->
    </div>

    <!-- Общий контейнер для центрирования контента -->
    <div class="content-wrapper">

        <!-- Главное Меню -->
        <div id="main-menu" class="menu-screen active-screen">
            <h1 data-i18n="mainMenu.title">Хроники Метерии: AI Приключение</h1>
            <div class="menu-buttons">
                <button id="new-game-button" data-i18n="mainMenu.newGame">Новая Игра</button>
                <button id="load-game-button" data-i18n="mainMenu.loadGame">Загрузить Игру</button>
                <button id="main-settings-button" data-i18n="mainMenu.settings">Настройки</button>
                <button id="help-button" data-i18n="mainMenu.help">Помощь</button>
                <button id="community-button" data-i18n="mainMenu.community">Сообщество</button>
                <p class="api-key-status" id="api-key-status" data-i18n="mainMenu.apiKeyStatusChecking">Статус API ключа: Проверка...</p>
            </div>
        </div>

		<!-- Меню Настроек -->
		<div id="settings-menu" class="menu-screen" style="display: none;">
			<h1 data-i18n="settingsMenu.title">Настройки</h1>
			
			<!-- Вкладки настроек -->
			<div class="settings-tabs-nav">
				<button class="settings-tab-btn active" onclick="switchSettingsTab(event, 'settings-ai-tab')"><i class="fas fa-robot"></i> ИИ и Язык</button>
				<button class="settings-tab-btn" onclick="switchSettingsTab(event, 'settings-audio-tab')"><i class="fas fa-volume-up"></i> Звук</button>
			</div>

			<div class="settings-content">
				<!-- ВКЛАДКА: ИИ -->
				<div id="settings-ai-tab" class="settings-tab-content active">
					<div class="form-group">
						<label for="language-select" data-i18n="settingsMenu.languageLabel">Язык:</label>
						<select id="language-select"></select>
					</div>
					<div class="form-group">
						<label for="api-provider-select" data-i18n="settingsMenu.apiProviderLabel">Провайдер ИИ:</label>
						<select id="api-provider-select">
							<option value="gemini">Google Gemini</option>
							<option value="llmost">LLMost.ru</option>
							<option value="openrouter">OpenRouter.ai</option>
							<option value="deepseek">DeepSeek</option>
							<option value="local">Local (LM Studio)</option>
						</select>
					</div>
					<div class="form-group" id="model-id-input-group">
						<label for="model-id-input">ID Модели:</label>
						<input type="text" id="model-id-input">
					</div>
					<div id="gemini-settings-group" class="provider-settings-group">
						<div class="form-group">
							<label>API Key:</label>
							<div class="input-with-button">
								<input type="password" id="gemini-api-key-input" placeholder="Вставьте ваш ключ">
								<button id="toggle-key-view" type="button" title="Показать/Скрыть"><i class="fas fa-eye"></i></button>
							</div>
						</div>
					</div>
					<!-- Группы для остальных провайдеров (упрощено для краткости, JS ими управляет) -->
					<div id="llmost-settings-group" class="provider-settings-group"><input type="password" id="llmost-api-key-input" placeholder="LLMost Key"></div>
					<div id="deepseek-settings-group" class="provider-settings-group"><input type="password" id="deepseek-api-key-input" placeholder="DeepSeek Key"></div>
					<div id="openrouter-settings-group" class="provider-settings-group"><input type="password" id="openrouter-api-key-input" placeholder="OpenRouter Key"></div>
					<div id="local-settings-group" class="provider-settings-group"><input type="text" id="local-url-input" placeholder="http://localhost:1234/v1"></div>
				</div>

				<!-- ВКЛАДКА: ЗВУК -->
				<div id="settings-audio-tab" class="settings-tab-content">
					<div class="form-group">
						<label>Общая громкость: <span id="val-master-vol">70%</span></label>
						<input type="range" id="slider-master-vol" min="0" max="100" value="70">
					</div>
					<div class="form-group">
						<label>Музыка: <span id="val-music-vol">50%</span></label>
						<input type="range" id="slider-music-vol" min="0" max="100" value="50">
					</div>
					<div class="form-group">
						<label>Эффекты (UI): <span id="val-ui-vol">80%</span></label>
						<input type="range" id="slider-ui-vol" min="0" max="100" value="80">
					</div>
					<div class="form-group" id="tts-voice-selector-group">
						<label>Голос озвучки:</label>
						<select id="tts-voice-select"></select>
					</div>
				</div>
				
				<div class="form-group">
					 <button id="save-settings-button">Сохранить всё</button>
				</div>
			</div>
			<button class="back-button" id="settings-back-button">Назад</button>
		</div>

    </script>
    
    <script src="script.js"></script>
</body>
</html>
